# Docker Compose for MCP Excalidraw
#
# Usage scenarios:
# 1. Canvas only:       docker-compose up canvas
# 2. MCP only:          docker-compose up mcp (requires canvas running elsewhere)
# 3. Both:              docker-compose --profile full up
#
# Most common: Run canvas locally, MCP via Claude Desktop config

services:
  # Canvas server (optional) - Visual UI and REST API
  canvas:
    build:
      context: .
      dockerfile: Dockerfile.canvas
    image: sanjibdevnath/mcp-excalidraw-local-canvas:latest
    container_name: mcp-excalidraw-canvas
    ports:
      # Host-side port only — kept off 3000 since that's a very common default
      # for other local dev servers (create-react-app, Backstage, etc.) and a
      # host-side collision silently shadows this container for anything that
      # resolves "localhost" to whichever process bound it more specifically.
      # Override with CANVAS_HOST_PORT if 3737 is also taken.
      - "${CANVAS_HOST_PORT:-3737}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DEBUG=false
    volumes:
      # Without this, EXCALIDRAW_DB_PATH=/app/data/excalidraw.db (set in
      # Dockerfile.canvas) resolves inside the container's own filesystem —
      # every restart starts from a brand-new, empty database, disconnected
      # from whatever the host's MCP processes have been writing to
      # (default: ~/.excalidraw-mcp/excalidraw.db).
      - ${HOME}/.excalidraw-mcp:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network

  # MCP server - Core product (typically run via Claude Desktop, not docker-compose)
  # This is here for testing or special deployment scenarios
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanjibdevnath/mcp-excalidraw-local:latest
    container_name: mcp-excalidraw-mcp
    stdin_open: true
    tty: true
    environment:
      - NODE_ENV=production
      - EXPRESS_SERVER_URL=http://canvas:3000
      - ENABLE_CANVAS_SYNC=true
      - DEBUG=false
    depends_on:
      canvas:
        condition: service_healthy
    networks:
      - mcp-network
    profiles:
      - full

networks:
  mcp-network:
    driver: bridge
